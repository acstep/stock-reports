<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 基礎建設研究報告中心</title>
    <style>
        body {
            background-color: #080810;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3rem;
        }
        .report-list {
            list-style: none;
            padding: 0;
        }
        .report-item {
            background: #12121f;
            border: 1px solid #2d2d44;
            margin: 10px 0;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .report-item:hover {
            border-color: #4f46e5;
            transform: scale(1.02);
        }
        .report-link {
            color: #818cf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .date {
            color: #a0a0a0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 基礎建設研究報告</h1>

            <li class="report-item">
